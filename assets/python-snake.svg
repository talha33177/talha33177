<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 130" width="100%">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b4f72"/>
      <stop offset="0.5" stop-color="#3776ab"/>
      <stop offset="1" stop-color="#ffd43b"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff2a8" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <path d="M10,70 C110,10 160,130 260,70 S410,10 510,70 S660,130 760,70"
        fill="none" stroke="#000" stroke-opacity="0.25" stroke-width="30"
        stroke-linecap="round" transform="translate(0,6)"/>

  <!-- body -->
  <path id="p" d="M10,65 C110,5 160,125 260,65 S410,5 510,65 S660,125 760,65"
        fill="none" stroke="url(#body)" stroke-width="28" stroke-linecap="round"/>

  <!-- belly highlight -->
  <path d="M10,65 C110,5 160,125 260,65 S410,5 510,65 S660,125 760,65"
        fill="none" stroke="url(#belly)" stroke-width="8" stroke-linecap="round"
        transform="translate(0,5)"/>

  <!-- moving scale pattern (slithering effect) -->
  <path d="M10,65 C110,5 160,125 260,65 S410,5 510,65 S660,125 760,65"
        fill="none" stroke="#0d1117" stroke-opacity="0.55" stroke-width="12"
        stroke-dasharray="10 26" stroke-linecap="butt">
    <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <path d="M10,65 C110,5 160,125 260,65 S410,5 510,65 S660,125 760,65"
        fill="none" stroke="#ffd43b" stroke-opacity="0.35" stroke-width="3"
        stroke-dasharray="4 32">
    <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <!-- head -->
  <g transform="translate(762,64) rotate(-31)">
    <ellipse cx="14" cy="0" rx="28" ry="16" fill="#ffd43b"/>
    <ellipse cx="14" cy="4" rx="24" ry="9" fill="#fff2a8" opacity="0.7"/>
    <circle cx="20" cy="-8" r="4.5" fill="#0d1117"/>
    <circle cx="20" cy="8" r="4.5" fill="#0d1117"/>
    <ellipse cx="21" cy="-8" rx="1" ry="3.5" fill="#ffd43b"/>
    <ellipse cx="21" cy="8" rx="1" ry="3.5" fill="#ffd43b"/>
    <circle cx="36" cy="-3" r="1.2" fill="#0d1117"/>
    <circle cx="36" cy="3" r="1.2" fill="#0d1117"/>
    <!-- tongue -->
    <path d="M42,0 L58,0 M58,0 L66,-6 M58,0 L66,6" stroke="#e5484d" stroke-width="2.2"
          stroke-linecap="round" fill="none">
      <animate attributeName="opacity" values="0;1;1;0;0" dur="2s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
