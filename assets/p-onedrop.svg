<svg xmlns="http://www.w3.org/2000/svg" width="600" height="382" viewBox="0 0 600 382" role="img" aria-label="OneDrop: multi-tenant courier platform on .NET 10, in progress"><title>OneDrop: multi-tenant courier platform on .NET 10, in progress</title><defs></defs><rect x="20" y="20" width="570" height="352" fill="#7BDCB5" /><rect x="10" y="10" width="570" height="352" fill="#FFFDF6" stroke="#141414" stroke-width="4" stroke-dasharray="14 9" /><rect x="10" y="10" width="570" height="56" fill="#7BDCB5" stroke="#141414" stroke-width="4" /><text x="30" y="46" font-family="'Courier New',Courier,monospace" font-size="20" font-weight="700" fill="#141414" letter-spacing="2" >04 / ONEDROP</text><rect x="428" y="22" width="134" height="32" fill="#FFC83D" rx="16" stroke="#141414" stroke-width="3" /><circle cx="448" cy="38" r="6" fill="#141414"><animate attributeName="opacity" values="1;1;0.2;0.2" keyTimes="0;0.5;0.5;1" dur="1.4s" repeatCount="indefinite"/></circle><text x="462" y="44" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="900" fill="#141414" letter-spacing="1" >BUILDING</text><text x="30" y="128" font-family="'Arial Black','Helvetica Neue',Arial,sans-serif" font-size="46" font-weight="900" fill="#141414" textLength="252" lengthAdjust="spacingAndGlyphs" >ONEDROP</text><text x="30" y="162" font-family="'Courier New',Courier,monospace" font-size="18" font-weight="700" fill="#3a3a3a" >Multi-tenant courier platform</text><text x="30" y="184" font-family="'Courier New',Courier,monospace" font-size="18" font-weight="700" fill="#3a3a3a" >on .NET 10</text><text x="30" y="212" font-family="'Courier New',Courier,monospace" font-size="16" font-weight="700" fill="#141414" >in progress, not live yet</text><text x="30" y="248" font-family="'Courier New',Courier,monospace" font-size="17" font-weight="700" fill="#141414" >→  Many shops, one rider</text><text x="30" y="274" font-family="'Courier New',Courier,monospace" font-size="17" font-weight="700" fill="#1