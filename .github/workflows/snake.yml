name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/python-snake.svg?color_snake=#ffd43b&color_dots=#161b22,#173a5e,#2b5f8e,#3776ab,#4b8bbe
            dist/python-snake-dark.svg?palette=github-dark&color_snake=#ffd43b&color_dots=#161b22,#173a5e,#2b5f8e,#3776ab,#4b8bbe

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
